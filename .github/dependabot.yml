# Keeps what Grove is built from up to date: the Rust crates in Cargo.lock,
# and the actions CI runs. Pull requests go to dev, like any other change.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    # cxx and cxx-gen must move together, since one generates the C++ the
    # other's runtime is linked with; cxx-qt's crates likewise.
    groups:
      cxx:
        patterns: ["cxx", "cxx-*", "cxxbridge-*"]
      cxx-qt:
        patterns: ["cxx-qt", "cxx-qt-*", "qt-build-utils"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
